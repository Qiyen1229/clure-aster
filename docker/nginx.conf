# Aster 記帳 — nginx 設定（容器內監聽 9122）

# 外層反向代理（Synology／Cloudflare Tunnel 等）已終止 HTTPS 時，沿用它傳來的協定，讓後端正確設定 Secure Cookie
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 9122;
    listen [::]:9122;
    server_name _;
    # 前端建置產物：熱更新版由 web-builder 寫入共用資料卷，建置完成後整個目錄一次切換（不會讀到建置一半的檔案）
    root /srv/www/current;
    index index.html;
    charset utf-8;

    # 取得真實客戶端 IP（頻率限制與審計日誌需要）：只信任來自私有網段（你的反向代理、Docker 網路）的轉發標頭
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # 健康檢查
    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    # manifest：正確 MIME + 不快取
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Service Worker、index.html 永不快取 → 新版本才能被偵測（觸發「有新版本，點擊更新」）
    location ~* ^/(sw\.js|registerSW\.js|index\.html)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # 帶 hash 的建置產物可永久快取
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/(icons|splash)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 捷徑送入收件匣：連結碼把權杖放在網址（?t=），不寫入存取日誌
    location /api/hook/ {
        access_log off;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $aster_api http://api:8000;
        proxy_pass $aster_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
    }

    # 後端 API → api 容器（FastAPI：帳號、管理後台）。同源，Cookie 可用 SameSite=Lax
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $aster_api http://api:8000;
        proxy_pass $aster_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
        client_max_body_size 8m;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # 報價代理的登入檢查：只有已登入 App 的使用者可以使用 /proxy/（避免被陌生人當成免費代理）
    # 後端 CLURE_PROXY_REQUIRE_LOGIN=false 時一律放行（例如建置時關閉帳號系統 VITE_AUTH_MODE=off）
    location = /_proxy_auth {
        internal;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $aster_api_auth http://api:8000;
        proxy_pass $aster_api_auth/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    # 股票報價代理 → quote-proxy 容器（同源，前端不需處理 CORS）
    location /proxy/ {
        auth_request /_proxy_auth;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $quote_proxy http://quote-proxy:9123;
        proxy_pass $quote_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 20s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
    }

    # SPA：所有路由（含 /add?amount=… 深層連結）回到 index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
