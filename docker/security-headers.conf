# 共用安全標頭（nginx 的 add_header 不會從上層繼承，因此每個 location 都 include 這份）
# COOP／CORP：頁面與資源只限同源，擋掉跨站視窗操作與跨站資源嵌入（Spectre 類側信道的縱深防禦）；
# connect-src 只列實際用到的網域（最小權限）。
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
# connect-src：匯率 API、可直連（支援 CORS）的 Finnhub／Twelve Data／Alpha Vantage；台股與 Yahoo 走同源 /proxy/。
#   若改用 Cloudflare Worker 等其他網域的代理，請把「你自己的」完整網址加進 connect-src（例如 https://clure-proxy.you.workers.dev），
#   不要用 *.workers.dev 萬用字元（等於允許連到任何人的 Worker）。
# style：新版瀏覽器以 style-src-elem 禁止 inline <style>、只允許元件的 style 屬性；不支援 CSP3 的舊瀏覽器退回 style-src。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://open.er-api.com https://finnhub.io https://api.twelvedata.com https://www.alphavantage.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
add_header Strict-Transport-Security "max-age=15552000" always;
