<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景：深空中性黑藍、極輕微上下漸層；id=bg 供 gen-icons 圓角 favicon 替換 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 品牌星芒：Lucide asterisk（24×24 幾何 ×44 置中）；Aster 源自希臘文 asteriskos「小星」 -->
  <g id="art" transform="translate(0 0)">
    <g transform="translate(-16 -16) scale(44)" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6v12"/>
      <path d="M17.196 9 6.804 15"/>
      <path d="m6.804 9 10.392 6"/>
    </g>
  </g>
</svg>