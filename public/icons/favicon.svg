<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Clure App 圖標：深色漸層底 + 幾何三角稜鏡 + 金幣，滿版方形（iOS 會自動裁圓角） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101A2E"/>
      <stop offset="1" stop-color="#03050A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tri" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <path d="M512 248 L760 712 H264 Z" fill="none" stroke="url(#tri)" stroke-width="68" stroke-linejoin="round"/>
  <path d="M512 248 L512 712" stroke="url(#tri)" stroke-width="20" stroke-linecap="round" opacity="0.35"/>
  <circle cx="512" cy="588" r="74" fill="url(#coin)"/>
  <circle cx="512" cy="588" r="44" fill="none" stroke="#B45309" stroke-opacity="0.45" stroke-width="10"/>
</svg>
